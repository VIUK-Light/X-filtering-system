<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SafeSearch 4 — フィルタ設定</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
  </head>
  <body>
    <main class="layout">
      <header class="page-header">
        <div class="brand-row">
          <img class="app-icon" src="icons/icon32.png" alt="" aria-hidden="true">
          <span class="brand">SafeSearch 4</span>
        </div>
        <h1>フィルタ設定</h1>
        <p>カテゴリの制限と、サイトごとの例外を設定します。</p>
      </header>

      <section class="category-panel" aria-labelledby="categories-heading">
        <div class="section-heading">
          <div>
            <h2 id="categories-heading">制限するカテゴリ</h2>
            <p>選択したカテゴリに該当するページをブロックします。</p>
          </div>
          <p id="category-message" class="message" role="status">読み込み中</p>
        </div>
        <div class="category-actions">
          <button id="select-all-categories" class="secondary" type="button">全選択</button>
          <button id="select-no-categories" class="secondary" type="button">全解除</button>
        </div>
        <fieldset id="category-options" class="category-options" aria-label="有効にするカテゴリ"></fieldset>
        <p class="category-note">内容を確認できないページは表示を止めます。サイト別の許可・ブロックルールは優先されます。</p>
      </section>

      <div class="management-grid">
        <form id="rule-form" class="rule-panel">
          <h2 class="panel-title">ホストごとの例外ルール</h2>
          <div class="rule-fields">
            <div class="field field-host">
              <label for="host">ホスト名またはURL</label>
              <input id="host" name="host" autocomplete="off" placeholder="example.invalid" required>
            </div>
            <div class="field">
              <label for="action">動作</label>
              <select id="action" name="action">
                <option value="block">ブロック</option>
                <option value="allow">許可</option>
              </select>
            </div>
            <div class="field" id="category-field">
              <label for="category">ブロックカテゴリ</label>
              <select id="category" name="category"></select>
            </div>
          </div>
          <div class="form-footer">
            <button type="submit">ルールを追加</button>
            <p id="form-message" class="message" role="status"></p>
          </div>
        </form>

        <section class="rules-panel" aria-labelledby="rules-heading">
          <div class="section-heading">
            <div>
              <h2 id="rules-heading">登録済みルール</h2>
              <p id="rule-count">読み込み中</p>
            </div>
          </div>
          <ul id="rule-list" class="rule-list"></ul>
        </section>
      </div>


      <footer class="site-footer">
        <span>VIUK-Light 2026 · VIUK 2024-2026</span>
      </footer>
    </main>
  </body>
</html>
