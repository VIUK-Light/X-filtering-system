<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SafeSearch 4 — ページをブロックしました</title>
    <link rel="stylesheet" href="blocked.css">
    <script src="blocked-page.js" defer></script>
  </head>
  <body>
    <main class="blocked-page" aria-live="polite" aria-labelledby="heading">
      <p class="brand">SafeSearch 4</p>
      <h1 id="heading">このページはブロックされました</h1>
      <p id="summary" class="summary">ページの内容が制限対象に該当したため、表示できません。</p>

      <div id="site-row" class="detail-row" hidden>
        <span class="detail-label">対象サイト</span>
        <span id="site-address" class="site-address"></span>
      </div>
      <div id="category-row" class="detail-row category-row" hidden>
        <span class="detail-label">カテゴリ</span>
        <span id="category" class="category-chip"></span>
      </div>
      <p id="uncertainty" class="uncertainty" hidden></p>

      <button id="back-button" type="button">前のページに戻る</button>
    </main>
  </body>
</html>
